name: Provision Infrastructure

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Database Request ID (UUID)'
        required: true
        type: string
      resource_type:
        description: 'Resource Type (postgres, redis, s3)'
        required: true
        type: string
      instance_size:
        description: 'Instance Size (small, medium, large)'
        required: true
        type: string
      email:
        description: 'Requester Email'
        required: true
        type: string
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        type: string
      allowed_ip:
        description: 'Allowed IP Address'
        required: true
        type: string

# Required for OIDC token generation (keyless auth — no stored AWS keys)
permissions:
  id-token: write
  contents: read

env:
  BACKEND_URL: ${{ secrets.BACKEND_URL }}
  WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
  REQUEST_ID: ${{ github.event.inputs.request_id }}

jobs:
  provision:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20 # RDS takes 5-10 min; default 360 is too generous
    concurrency:
      group: provision-${{ github.event.inputs.request_id }}
      cancel-in-progress: false # Don't cancel a running provision

    steps:
      # ------------------------------------------------------------------
      # Helper: report progress to backend (skips gracefully if no BACKEND_URL)
      # ------------------------------------------------------------------
      - name: Report — Workflow Start
        if: always()
        run: |
          [ -z "$BACKEND_URL" ] && echo "BACKEND_URL not set, skipping callback" && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d "{\"step\":\"workflow_start\",\"status\":\"running\",\"message\":\"🚀 GitHub Actions workflow started\",\"details\":{\"run_id\":\"${{ github.run_id }}\",\"run_url\":\"${RUN_URL}\"}}" \
            || echo "Backend callback failed (non-fatal)"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Report — Code Checked Out
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"checkout","status":"success","message":"✅ Repository checked out"}' \
            || echo "Backend callback failed (non-fatal)"

      # ===========================================================================
      # OIDC Authentication: No long-lived AWS access keys stored in GitHub Secrets.
      # Grants a short-lived token scoped to this run only.
      # SETUP: Create an IAM Role with a GitHub OIDC trust policy and add its ARN
      # to GitHub Secrets as GH_ACTIONS_ROLE_ARN.
      # Guide: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
      # ===========================================================================
      - name: Debug OIDC Token Claims
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Token received: $(echo $OIDC_TOKEN | cut -c1-20)..."
          echo "=== DECODED CLAIMS ==="
          echo $OIDC_TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, repository_owner}' || echo "Failed to decode"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Report — AWS Credentials Obtained
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"aws_auth","status":"success","message":"✅ AWS credentials obtained via OIDC (no static keys)"}' \
            || echo "Backend callback failed (non-fatal)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"

      - name: Report — Terraform Ready
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"terraform_setup","status":"success","message":"✅ Terraform CLI installed"}' \
            || echo "Backend callback failed (non-fatal)"

      - name: Terraform Init (with per-request remote state)
        working-directory: ./terraform
        # Each request gets its OWN isolated state file in S3.
        # This prevents concurrent provisioning runs from conflicting.
        run: |
          terraform init \
            -backend-config="key=state/${{ github.event.inputs.request_id }}.tfstate"

      - name: Report — Terraform Initialized
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"terraform_init","status":"success","message":"✅ Terraform state backend initialized (isolated S3 state per request)"}' \
            || echo "Backend callback failed (non-fatal)"

      - name: Report — Terraform Plan Starting
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"terraform_plan","status":"running","message":"📋 Computing Terraform plan..."}' \
            || echo "Backend callback failed (non-fatal)"

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          set -o pipefail
          # Run terraform and stream its output to a while loop
          terraform apply -auto-approve \
            -var="request_id=${{ github.event.inputs.request_id }}" \
            -var="resource_type=${{ github.event.inputs.resource_type }}" \
            -var="instance_size=${{ github.event.inputs.instance_size }}" \
            -var="requester_email=${{ github.event.inputs.email }}" \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="allowed_ip=${{ github.event.inputs.allowed_ip }}" 2>&1 | while IFS= read -r line; do
            
            # Print to GitHub Actions log
            echo "$line"
            
            # Filter output to only send significant progress lines to the UI terminal
            if [[ "$line" == *"Still creating..."* ]] || [[ "$line" == *"Creation complete"* ]] || [[ "$line" == *"Apply complete!"* ]] || [[ "$line" == *"Error:"* ]]; then
              # Strip ANSI colors using sed
              CLEAN_LINE=$(echo "$line" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\x1b\[[0-9;]*K//g')
              
              # Safely build JSON payload with jq
              JSON_PAYLOAD=$(jq -n --arg msg "$CLEAN_LINE" '{"step":"terraform_apply","status":"running","message":$msg}')
              
              # Fire webhook in background so it doesn't block terraform stdout
              curl -s -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
                -H "Content-Type: application/json" \
                -H "x-api-key: ${WEBHOOK_API_KEY}" \
                -d "$JSON_PAYLOAD" &
            fi
          done
          
          # Wait for any background curls to finish
          wait

      - name: Report — Infrastructure Created
        working-directory: ./terraform
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          # Capture Terraform outputs if available, fall back gracefully
          ENDPOINT=$(terraform output -raw rds_endpoint 2>/dev/null || echo "")
          RESOURCE_ID=$(terraform output -raw aws_resource_id 2>/dev/null || echo "")
          DETAILS="{}"
          [ -n "$ENDPOINT" ] && DETAILS="{\"endpoint\":\"${ENDPOINT}\",\"aws_resource_id\":\"${RESOURCE_ID}\"}"
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d "{\"step\":\"terraform_apply\",\"status\":\"success\",\"message\":\"🏗️ AWS resources created\",\"details\":${DETAILS}}" \
            || echo "Backend callback failed (non-fatal)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Terraform Outputs and Update Status
        working-directory: ./terraform
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
        run: |
          export TF_OUT_CONNECTION_STRING=$(terraform output -raw connection_string)
          export TF_OUT_AWS_RESOURCE_ID=$(terraform output -raw aws_resource_id)
          cd ../
          python .github/scripts/update_status.py

      - name: Report — Complete (Success)
        if: success()
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"complete","status":"success","message":"🎉 Provisioning complete! Your resource is ready."}' \
            || echo "Backend callback failed (non-fatal)"

      # On failure, update the request status to 'failed' so the dashboard reflects it
      - name: Update Status to Failed (on error)
        if: failure()
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
          FAILED: "true"
        run: python .github/scripts/update_status.py

      - name: Report — Complete (Failure)
        if: failure()
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          curl -sf -X POST "${BACKEND_URL}/api/requests/${REQUEST_ID}/progress" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${WEBHOOK_API_KEY}" \
            -d '{"step":"complete","status":"failed","message":"❌ Provisioning failed. Check GitHub Actions logs for details."}' \
            || echo "Backend callback failed (non-fatal)"
